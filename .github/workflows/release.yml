name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build for ${{ matrix.os }}
    # This matrix tells GitHub to run the job 3 times using the details below
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: networking
            asset_name: networking-linux
          - os: macos-latest
            artifact_name: networking
            asset_name: networking-macos
          - os: windows-latest
            artifact_name: networking.exe
            asset_name: networking-windows.exe

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the project
        run: cargo build --release

      - name: Rename binary for release
        # We force bash so the `mv` command works even on the Windows runner
        shell: bash
        run: |
          mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
